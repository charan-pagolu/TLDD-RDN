    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load("current", {packages:["corechart"]});
      google.charts.setOnLoadCallback(drawChart);
      function drawChart() {
        var data = google.visualization.arrayToDataTable([
          ['class', 'percentage'],
          ['Tomato___Bacterial_spot',     40],
         
          ['Tomato___healthy',    30],
		  ['Tomato___Leaf_Mold',     35],
         
          ['Tomato___Early_blight',    45],
		  ['Tomato___Septoria_leaf_spot',     30],
         
          ['Tomato_Yellow_Leaf_Curl_Virus',    25]
        ]);

        var options = {
          title: '',
          is3D: true,
        };

        var chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
        chart.draw(data, options);
      }
	  
    </script>
  </head>
  <body>
    <center><h1>Tomato Leaf Disease Identification detection </h1></center>
   
    <center><div id="piechart_3d" style="width: 900px; height: 500px; "></div></center>
